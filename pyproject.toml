[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vc-audit-tool"
version = "0.1.0"
description = "Auditable private company valuation workflow for VC portfolios."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2.31",
    "httpx>=0.27",
    "sentence-transformers>=2.2",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "duckduckgo-search>=7.0",
    "pyyaml>=6.0",
]

[project.scripts]
vc-audit-server = "vc_audit_tool.server:main"
vc-audit = "vc_audit_tool.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
    "pytest>=8.0",
]
# LLM providers — install whichever you plan to use (or all).
# The cheapest API option is Gemini Flash (~$0.001/request).
llm = [
    "langchain-google-genai>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (linter + formatter) ──
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins
    "T20",  # flake8-print (flag print statements in library code)
]
ignore = [
    "T201",  # allow print() in CLI/server entry points
]

[tool.ruff.lint.isort]
known-first-party = ["vc_audit_tool"]

[tool.ruff.lint.per-file-ignores]
# server.py embeds a raw HTML/CSS/JS template string — CSS lines exceed 100 chars.
"src/vc_audit_tool/server.py" = ["E501"]

# ── Pytest ──
[tool.pytest.ini_options]
markers = [
    "integration: tests that hit real external APIs (skipped in CI)",
]
# Default: run everything *except* integration tests
addopts = "-m 'not integration'"

# ── Mypy (strict type checking) ──
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["vc_audit_tool"]

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["httpx", "httpx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_core", "langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_openai", "langchain_openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_anthropic", "langchain_anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_google_genai", "langchain_google_genai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langchain_ollama", "langchain_ollama.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ollama", "ollama.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["duckduckgo_search", "duckduckgo_search.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ddgs", "ddgs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pinecone", "pinecone.*"]
ignore_missing_imports = true
