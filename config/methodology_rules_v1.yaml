version: "v1.0"

# Stage-level method exclusions (highest priority)
stage_exclusions:
  pre_seed:
    exclude:
      - comparable_companies
      - last_round_market_adjusted
      - last_round_multiple_ratchet
    require:
      - scorecard
      - berkus
    note: "Pre-revenue company — quantitative methods require revenue or round data"
  seed:
    exclude:
      - last_round_multiple_ratchet
    note: "Seed stage — ratchet methodology requires meaningful revenue at last round"

# Data-availability rules (applied after stage exclusions)
data_rules:
  last_round_age_months:
    - condition: "< 6"
      weight_modifier: "HIGH"
      rationale: "Round < 6 months old — highly reliable anchor"
    - condition: "6 to 18"
      weight_modifier: "MEDIUM"
      rationale: "Round 6-18 months old — moderate staleness"
    - condition: "18 to 36"
      weight_modifier: "LOW"
      rationale: "Round > 18 months old — staleness risk HIGH"
    - condition: "> 36"
      exclude: true
      rationale: "Round > 3 years old — excluded as unreliable anchor"

  peer_set_quality:
    - condition: "HIGH"
      weight_modifier: "HIGH"
      rationale: "Strong peer set quality — comps method is most reliable"
    - condition: "MEDIUM"
      weight_modifier: "MEDIUM"
      rationale: "Moderate peer set quality"
    - condition: "LOW"
      weight_modifier: "LOW"
      rationale: "Low peer set quality — comps method used with caution"

  has_revenue:
    - condition: false
      exclude:
        - comparable_companies
      rationale: "No revenue — cannot apply EV/Revenue multiple"

# Base weights by stage (before data-availability adjustments)
base_weights:
  pre_seed:
    scorecard: 0.50
    berkus: 0.50
  seed:
    scorecard: 0.35
    berkus: 0.30
    last_round_market_adjusted: 0.35
  early:
    comparable_companies: 0.50
    last_round_market_adjusted: 0.50
  growth:
    comparable_companies: 0.60
    last_round_market_adjusted: 0.40
  late:
    comparable_companies: 0.70
    last_round_market_adjusted: 0.30

# ── Private company illiquidity discount defaults ────────────────────────────
#
# Rationale: Private company equity is illiquid vs. a publicly traded equivalent.
# The discount reflects the cost of holding a position that cannot be easily sold.
# Lower discounts apply when direct price discovery exists (secondary market
# trades, recent rounds). Higher discounts apply when derived from public comps.
#
# last_round_market_adjusted uses a modest 10% because the anchor was a real
# private-market transaction, but the market-index adjustment uses public movement.
# Scorecard and Berkus are exempt — already calibrated for private companies.
#
private_company_discount:
  defaults:
    comparable_companies: 25
    last_round_market_adjusted: 10
    last_round_multiple_ratchet: 25
    direct_valuation:
      has_secondary_evidence: 10
      no_secondary_evidence: 20
  max_allowed: 50
  exempt:
    - scorecard
    - berkus
